kind: tb
name: tek boyutlu zincir
lattice_vectors_bohr: [[2.5, 0.0, 0.0]]
basis_bohr: [[0.0, 0.0, 0.0]]
onsite_ev: [-5.3]
hoppings:
  - {i: 0, j: 0, cell: [1, 0, 0], t_ev: -1.7}
  - {i: 0, j: 0, cell: [-1, 0, 0], t_ev: -1.7}
n_electron_per_cell: 1
# k_points = 100. `converged` KANITLI bir sinira bakar (04.10.2026): bu
# zincirde B2 = |t| pi^2 / n^2 = 6.17e-05 hartree <= 1e-4, yani ✓; ✓ icin
# n >= 79, paritesinden bagimsiz. Eskiden n ile 2n karsilastiriliyordu; bu
# zincirde cift n'de fark TAM 0'di ve o ✓ dogruydu (uclar izgaradaydi), ama
# olcut n'nin hatasini degil iyilesmeyi olctugu icin baska modellerde
# kandiriliyordu (bkz. src/qlab/engine/tb/factory.py, `_K_YAKINSAMA_ESIGI`).
k_points: 100
