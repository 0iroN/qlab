# H8 halkasinin UHF indirgemesi -- Modul 3H.
#
# NEDEN UHF: d = 2.0 bohr'da RHF SPIN KARARSIZDIR (uclu Hessian'in en kucuk
# ozdegeri -0.399689718; olculdu, tests/tb/test_downfold_yasa.py). N=8 bir 4n
# halkasidir ve TB spektrumunun HOMO/LUMO'su tam dejeneredir; RHF dejenere
# seviyeyi cift isgale zorlayinca spin kararsizligi doguyor. Bu senaryonun
# alti mesafesinin de altisinda ayni isaret olculdu, yani RHF indirgemesi
# burada HF'in taban durumunu DEGIL bir eyer noktasini indirgerdi.
#
# Mesafeler bohr'dur ve DONUSUM YOKTUR: girdi bir geometridir.
kind: downfold
name: H8 halkasi UHF indirgemesi
ring_size: 8
distances_bohr: [1.8, 2.0, 2.2, 2.6, 3.2]
basis: sto-3g
n_neighbour: 2
seeds: 12
