[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlab"
version = "0.1.0"
description = "Kuantum laboratuvarı — TDSE ve Hartree-Fock motorları"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.98", "import-linter>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uzun süren fizik doğrulama testleri"]

[tool.importlinter]
root_package = "qlab"
# DIŞ paketleri (PySide6, pyqtgraph, OpenGL) yasak listesine koyabilmenin
# koşulu; bu bayrak olmadan import-linter "The top level configuration must
# have include_external_packages=True when there are external forbidden
# modules." diyerek hiçbir sözleşmeyi koşmadan çıkıyor.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "engine görselleştirmeyi bilmez"
type = "forbidden"
source_modules = ["qlab.engine"]
# DIŞ GUI paketleri de listede, ve bu boşluk ÖLÇÜLEREK bulundu: sözleşmenin
# ilan edilen amacı "engine görselleştirmeyi bilmez" iken, yalnızca `qlab.viz`
# ve `qlab.app` yasaklıydı. 9 ihlal tek tek enjekte edilip `lint-imports`
# koşuldu (altısı bu boşlukları, üçü kontrol); `engine/hf/scf.py`'ye eklenen
# `from PySide6 import QtWidgets`, `import pyqtgraph.opengl` ve
# `import OpenGL` ÜÇÜ DE rc=0 ile geçiyordu -- yani engine doğrudan Qt'ye
# bağlanabilir ve sözleşme susardı. Kontrol olarak enjekte edilen
# `engine -> qlab.viz`, `engine -> qlab.app` ve `scenario -> qlab.engine`
# rc=1 ile yakalanıyordu, yani araç çalışıyordu; eksik olan KAPSAMDI.
forbidden_modules = [
    "qlab.viz",
    "qlab.app",
    "PySide6",
    "pyqtgraph",
    "OpenGL",
    # `matplotlib` ÖLÇÜLEREK eklendi (Modül 3, 20.08.2026):
    # `engine/tb/bands.py`ye enjekte edilen `import matplotlib.pyplot`
    # rc=0 ile GEÇİYORDU ve üç sözleşme de KEPT diyordu; aynı dosyaya konan
    # `from PySide6 import QtWidgets` kontrolü ise rc=1 veriyordu, yani araç
    # çalışıyordu ve eksik olan KAPSAMDI. Deponun `src/` ağacında matplotlib
    # hiç kullanılmıyor (0 eşleşme), yani bu satırın bedeli sıfır, kazancı
    # gerçek bir kaçış deliğinin kapanması.
    "matplotlib",
]

[[tool.importlinter.contracts]]
name = "observable görselleştirmeyi ve GUI'yi bilmez"
type = "forbidden"
source_modules = ["qlab.observable"]
# Aynı ölçümde `observable/hf_obs.py` -> `from PySide6 import QtWidgets` de
# rc=0 ile kaçıyordu. `observable -> qlab.viz/qlab.app` katman sözleşmesince
# zaten yakalanıyor; kaçan yalnızca DIŞ GUI bağımlılıklarıydı.
forbidden_modules = ["PySide6", "pyqtgraph", "OpenGL"]

[[tool.importlinter.contracts]]
name = "Katmanlı mimari"
type = "layers"
# Parantez, katmanı "opsiyonel" olarak işaretler: modül henüz mevcut değilse
# import-linter onu atlar. Görevler ilerledikçe modüller tek tek ortaya
# çıkacağı için (Task 3'te qlab.engine, sonrasında diğerleri) sözleşme her
# aşamada geçerliliğini korur; var olan katmanlar arasındaki sıralama yine
# tam olarak zorlanır.
#
# TEPE-SEVİYE MODÜLLER de artık adlandırılmış durumda. Ölçüldü: listede
# olmadıkları için `engine.hf.analysis -> qlab.run` ve `qlab.units ->
# qlab.engine.hf.scf` ihlalleri rc=0 ile kaçıyordu. `qlab.run` bir CLI giriş
# noktasıdır ve app'in yanında, en üstte durur; `qlab.provenance`,
# `qlab.types`, `qlab.units`, `qlab.errors` ise yaprak sözleşme tipleridir ve
# en altta. (İkisi dolaylı olarak zaten yakalanıyordu -- katmanlı modüller
# TARAFINDAN import edildikleri için zincir katman kesiyordu -- ama `run` ve
# `units` yakalanmıyordu; artık dördü de açıkça adlandırılmış.)
#
# `qlab.bridge_map` (Modül 7) `qlab.types`ın YANINA, bağımsız kardeş olarak
# konuldu: saf tanım katmanıdır ve hiçbir motoru import etmez, o yüzden
# `engine`in ALTINDA durmak zorundadır. Katman SIRASI değişmedi, yalnız
# mevcut bir katmana kardeş eklendi. ÖLÇÜLDÜ (30.08.2026): listede
# olmadığında `bridge_map -> qlab.engine.hf.scf` ihlali rc=0 ile KAÇIYORDU;
# bu satırla aynı ihlal rc=1 veriyor.
layers = [
    "(qlab.run) : (qlab.app)",
    "(qlab.viz)",
    "(qlab.observable)",
    "(qlab.engine)",
    "(qlab.scenario)",
    "(qlab.provenance)",
    "(qlab.types) : (qlab.bridge_map)",
    "(qlab.units) : (qlab.errors)",
]
