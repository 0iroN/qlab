[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlab"
version = "0.1.0"
description = "Kuantum laboratuvarı — TDSE ve Hartree-Fock motorları"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.98", "import-linter>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uzun süren fizik doğrulama testleri"]

[tool.importlinter]
root_package = "qlab"

[[tool.importlinter.contracts]]
name = "engine görselleştirmeyi bilmez"
type = "forbidden"
source_modules = ["qlab.engine"]
forbidden_modules = ["qlab.viz", "qlab.app"]

[[tool.importlinter.contracts]]
name = "Katmanlı mimari"
type = "layers"
layers = ["qlab.app", "qlab.viz", "qlab.observable", "qlab.engine", "qlab.scenario"]
